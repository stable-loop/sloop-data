plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  NewCops: disable
  Exclude:
    - lib/sloop-pack.rb
    - app/helpers/data/show_value_helper.rb
    - vendor/**/*

Metrics/BlockLength:
  Exclude:
    - Guardfile

Metrics/ClassLength:
  Max: 150

Metrics/MethodLength:
  Max: 15

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Naming/FileName:
  Exclude:
    - lib/sloop-data.rb

RSpec/DescribeClass:
  Exclude:
    - spec/tasks/package_tasks_spec.rb

RSpec/ExampleLength:
  Max: 25

RSpec/MultipleExpectations:
  Max: 5
